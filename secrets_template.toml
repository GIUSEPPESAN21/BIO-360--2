# =============================================================================
# BIOETHICARE 360 - Plantilla de secretos
# =============================================================================
# El README indica usar este archivo como guía. COPIA este archivo a
# `.streamlit/secrets.toml` y rellena los valores reales allí.
#
#   Windows (PowerShell):
#     mkdir .streamlit
#     copy secrets_template.toml .streamlit\secrets.toml
#
# `.streamlit/secrets.toml` está excluido por .gitignore y NUNCA debe
# versionarse: contiene la clave privada de la cuenta de servicio de Firebase,
# que otorga acceso administrativo completo a los datos clínicos.
#
# Este archivo de plantilla NO debe contener valores reales.
# =============================================================================

# --- Proveedores de IA -------------------------------------------------------
# Solo se necesita la clave del proveedor que vayas a usar. El selector de
# "Perfil y Configuración" solo ofrece los proveedores cuya clave esté presente.

# Google Gemini — https://aistudio.google.com/app/apikey
GEMINI_API_KEY = "PEGA_AQUI_TU_CLAVE_DE_GEMINI"

# OpenAI — https://platform.openai.com/api-keys
OPENAI_API_KEY = "PEGA_AQUI_TU_CLAVE_DE_OPENAI"

# Kiro — proveedor de IA externo (patrón Strategy, services/ai/kiro_provider.py)
# KIRO_BASE_URL es opcional; si se omite se usa el valor por defecto del proveedor.
# NOTA: el contrato HTTP asumido por kiro_provider.py (POST {base_url}/v1/analyze)
# no ha sido verificado contra la API real. Ajusta RUTA_ANALYZE y
# _extraer_payload en ese archivo si tu endpoint difiere.
KIRO_API_KEY = "PEGA_AQUI_TU_CLAVE_DE_KIRO"
KIRO_BASE_URL = "https://api.kiro.ai"


# --- Firebase: credenciales de servidor (Admin SDK) --------------------------
# Origen: Consola de Firebase > Configuración del proyecto > Cuentas de servicio
#         > "Generar nueva clave privada" (descarga un JSON).
# Copia cada campo del JSON descargado a la sección de abajo.
#
# ⚠️  `private_key` es una credencial administrativa. Trátala como una
#     contraseña de producción: no la pegues en chats, issues ni capturas.
[firebase_credentials]
type = "service_account"
project_id = "TU_PROJECT_ID"
private_key_id = "TU_PRIVATE_KEY_ID"
# Conserva los \n literales tal como aparecen en el JSON descargado:
# la aplicación los convierte a saltos de línea reales al inicializar.
private_key = "-----BEGIN PRIVATE KEY-----\nTU_CLAVE_PRIVADA_AQUI\n-----END PRIVATE KEY-----\n"
client_email = "firebase-adminsdk-xxxxx@TU_PROJECT_ID.iam.gserviceaccount.com"
client_id = "TU_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk-xxxxx%40TU_PROJECT_ID.iam.gserviceaccount.com"
universe_domain = "googleapis.com"


# --- Firebase: configuración de cliente (autenticación con Pyrebase) ---------
# Origen: Consola de Firebase > Configuración del proyecto > Tus apps > Config.
# Estos valores son públicos por diseño (viajan al navegador), pero se mantienen
# fuera del repositorio para no exponer la identidad del proyecto.
[firebase_client_config]
apiKey = "TU_API_KEY_WEB"
authDomain = "TU_PROJECT_ID.firebaseapp.com"
projectId = "TU_PROJECT_ID"
storageBucket = "TU_PROJECT_ID.appspot.com"
messagingSenderId = "TU_MESSAGING_SENDER_ID"
appId = "TU_APP_ID"
databaseURL = ""
